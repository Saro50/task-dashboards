<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 讨论聊天窗 — AICodeAgent 任务分期看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        primary: { 50:'#ede9fe',100:'#ddd6fe',200:'#c4b5fd',300:'#a29bfe',400:'#8b7efa',500:'#6c5ce7',600:'#5a4bd1',700:'#4a3cb8',800:'#3d319a',900:'#332a7e' },
        dark: { 50:'#32324f',100:'#2a2a45',200:'#22223a',300:'#1a1a2e',400:'#151525',500:'#0f0f1a' },
      }}}}
  </script>
  <script src="js/utils.js"></script>
  <script src="js/mock-ai.js"></script>
  <style>
    body{opacity:0;transition:opacity .4s ease}body.loaded{opacity:1}
    .toast-container{position:fixed;top:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
    .toast{display:flex;align-items:center;gap:8px;padding:12px 20px;background:#1a1a2e;border:1px solid #2e2e48;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.4);font-size:14px;animation:toastIn .25s ease both;min-width:280px;color:#e8e8f0}
    .toast--success{border-left:3px solid #00cec9}.toast--error{border-left:3px solid #ff7675}.toast--info{border-left:3px solid #74b9ff}
    @keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
    .typing-dot{width:8px;height:8px;border-radius:50%;background:#a29bfe;animation:bounce 1.4s infinite ease-in-out}
    .typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
    .msg-content p{margin:4px 0;line-height:1.7}
    .msg-content ul,.msg-content ol{padding-left:18px;margin:4px 0}
    .msg-content li{margin:2px 0;line-height:1.6}
    .msg-content strong{color:#a29bfe}
    .msg-content code{background:#22223a;padding:1px 5px;border-radius:3px;font-size:.85em}
    #chatMessages::-webkit-scrollbar{width:5px}
    #chatMessages::-webkit-scrollbar-track{background:transparent}
    #chatMessages::-webkit-scrollbar-thumb{background:#3a3a56;border-radius:10px}
  </style>
</head>
<body class="bg-dark-500 text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- Nav -->
  <nav class="bg-gray-800/90 backdrop-blur-md sticky top-0 z-50 h-14 flex items-center px-4 sm:px-6 border-b border-gray-700 shrink-0">
    <a href="index.html" class="flex items-center gap-2 text-gray-300 hover:text-white transition-colors text-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>返回首页</a>
    <div class="mx-4 h-5 w-px bg-gray-600"></div>
    <div class="flex items-center gap-2">
      <span class="text-lg">💬</span>
      <span class="font-bold text-white text-sm sm:text-base">AI 讨论聊天窗</span>
      <span class="text-xs bg-primary-500/20 text-primary-300 px-2 py-0.5 rounded-full ml-1">Step 2/3</span>
    </div>
    <div class="ml-auto hidden sm:flex items-center gap-2 text-xs">
      <span class="flex items-center gap-1 text-green-400 font-semibold"><span class="w-5 h-5 rounded-full bg-green-600 text-white flex items-center justify-center text-[10px] font-bold">✓</span>项目创建</span>
      <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      <span class="flex items-center gap-1 text-primary-300 font-semibold"><span class="w-5 h-5 rounded-full bg-primary-600 text-white flex items-center justify-center text-[10px] font-bold">2</span>AI 讨论</span>
      <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      <span class="flex items-center gap-1 text-gray-500"><span class="w-5 h-5 rounded-full bg-gray-700 text-gray-500 flex items-center justify-center text-[10px] font-bold">3</span>任务图谱</span>
    </div>
  </nav>

  <!-- Project context bar -->
  <div id="contextBar" class="bg-dark-300 border-b border-gray-700 px-4 sm:px-6 py-2 flex items-center gap-3 text-sm shrink-0">
    <span class="text-gray-500">当前项目:</span>
    <span id="ctxProjectName" class="text-primary-300 font-semibold">未选择项目</span>
    <span class="text-gray-600 mx-1">|</span>
    <span id="ctxProjectDesc" class="text-gray-400 truncate max-w-md hidden sm:inline">请先创建项目</span>
  </div>

  <!-- Chat messages area -->
  <div id="chatMessages" class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 flex flex-col gap-4"></div>

  <!-- Bottom action bar (shown after generating tasks) -->
  <div id="bottomActions" class="hidden bg-dark-300 border-t border-gray-700 px-4 sm:px-6 py-3 flex items-center justify-between gap-3 shrink-0">
    <div class="flex items-center gap-2 text-sm">
      <span class="text-green-400">✅</span>
      <span class="text-gray-300 font-semibold">任务计划已生成</span>
      <span id="taskCount" class="text-xs bg-primary-500/20 text-primary-300 px-2 py-0.5 rounded-full">0 个任务</span>
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-300 text-sm font-semibold rounded-lg transition-colors">返回首页</a>
      <a id="btnViewGraph" href="task-graph.html" class="bg-primary-600 hover:bg-primary-700 text-white text-sm font-semibold px-5 py-2 rounded-lg transition-all flex items-center gap-1.5">🗺️ 查看任务图谱<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg></a>
    </div>
  </div>

  <!-- Chat input area -->
  <div id="chatInputArea" class="bg-dark-200 border-t border-gray-700 px-4 sm:px-6 py-3 shrink-0">
    <div class="max-w-3xl mx-auto flex items-end gap-3">
      <textarea id="chatInput" rows="1" placeholder="输入消息讨论任务需求..." class="flex-1 bg-dark-50 border border-gray-600 rounded-xl text-white text-sm px-4 py-3 outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-all placeholder-gray-500 resize-none max-h-32" onkeydown="handleKey(event)"></textarea>
      <button onclick="sendMessage()" id="btnSend" class="bg-primary-600 hover:bg-primary-700 text-white px-5 py-3 rounded-xl transition-all text-sm font-semibold flex items-center gap-1.5 shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">发送<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg></button>
    </div>
    <div class="max-w-3xl mx-auto flex items-center gap-2 mt-2">
      <span class="text-xs text-gray-500">快捷操作:</span>
      <button onclick="quickSend('请帮我分析并拆解这个项目的任务需求')" class="text-xs text-primary-400 hover:text-primary-300 bg-primary-500/10 px-2.5 py-1 rounded-lg transition-colors">📋 拆解任务</button>
      <button onclick="quickSend('请帮我制定项目开发计划')" class="text-xs text-primary-400 hover:text-primary-300 bg-primary-500/10 px-2.5 py-1 rounded-lg transition-colors">🗺 制定计划</button>
      <button onclick="generateAndConfirm()" class="text-xs text-green-400 hover:text-green-300 bg-green-500/10 px-2.5 py-1 rounded-lg transition-colors">✅ 确认并生成任务图谱</button>
    </div>
  </div>

  <script>
  (() => {
    'use strict';
    var chatMessages = document.getElementById('chatMessages');
    var chatInput = document.getElementById('chatInput');
    var btnSend = document.getElementById('btnSend');
    var isSending = false;
    var projectName = '\u672a\u547d\u540d\u9879\u76ee';
    var projectDesc = '';

    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => document.body.classList.add('loaded'));
      loadContext();
      addAIMessage('\u4f60\u597d\uff01\u6211\u662f AICodeAgent \u7684\u4efb\u52a1\u52a9\u624b \u{1F916}\n\n\u6211\u4f1a\u5e2e\u52a9\u4f60\u68b3\u7406\u9879\u76ee\u9700\u6c42\u3001\u62c6\u89e3\u4efb\u52a1\u6b65\u9aa4\uff0c\u5e76\u751f\u6210\u53ef\u89c6\u5316\u7684\u4efb\u52a1\u56fe\u8c31\u3002\n\n\u4f60\u53ef\u4ee5\u81ea\u7531\u8f93\u5165\u9700\u6c42\u63cf\u8ff0\uff0c\u6216\u8005\u4f7f\u7528\u4e0b\u65b9\u7684\u5feb\u6377\u6309\u94ae\u6765\u5f00\u59cb\u8ba8\u8bba\u3002');
    });

    function loadContext() {
      var project = Utils.storageGet('demo_project');
      if (project && project.name) {
        projectName = project.name;
        projectDesc = project.description || '';
        document.getElementById('ctxProjectName').textContent = projectName;
        document.getElementById('ctxProjectDesc').textContent = projectDesc;
      }
      var tasks = Utils.storageGet('demo_tasks');
      if (tasks && tasks.length > 0) {
        document.getElementById('bottomActions').classList.remove('hidden');
        document.getElementById('taskCount').textContent = tasks.length + ' \u4e2a\u4efb\u52a1';
      }
    }

    function addUserMessage(text) {
      var div = document.createElement('div');
      div.className = 'self-end max-w-[80%] bg-primary-600 text-white px-4 py-3 rounded-2xl rounded-br-sm text-sm leading-relaxed';
      div.style.animation = 'toastIn 0.3s ease both';
      div.textContent = text;
      chatMessages.appendChild(div);
      scrollToBottom();
    }

    function addAIMessage(text) {
      var wrapper = document.createElement('div');
      wrapper.className = 'self-start max-w-[85%] flex items-start gap-3';
      wrapper.style.animation = 'toastIn 0.3s ease both';
      var avatar = document.createElement('div');
      avatar.className = 'w-8 h-8 rounded-full bg-primary-500/20 flex items-center justify-center text-sm shrink-0';
      avatar.textContent = '\u{1F916}';
      var bubble = document.createElement('div');
      bubble.className = 'bg-dark-100 border border-gray-700 text-gray-200 px-4 py-3 rounded-2xl rounded-bl-sm text-sm leading-relaxed msg-content';
      bubble.innerHTML = Utils.markdownToHtml(text);
      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      chatMessages.appendChild(wrapper);
      scrollToBottom();
    }

    function showTypingIndicator() {
      var div = document.createElement('div');
      div.id = 'typingIndicator';
      div.className = 'self-start flex items-center gap-1.5 px-4 py-3 bg-dark-100 border border-gray-700 rounded-2xl rounded-bl-sm';
      div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      chatMessages.appendChild(div);
      scrollToBottom();
    }

    function hideTypingIndicator() {
      var el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    window.sendMessage = async function() {
      var text = chatInput.value.trim();
      if (!text || isSending) return;
      isSending = true;
      btnSend.disabled = true;
      chatInput.value = '';
      chatInput.style.height = 'auto';
      addUserMessage(text);
      showTypingIndicator();
      try {
        var response = await MockAI.simulateAIResponse(text);
        hideTypingIndicator();
        addAIMessage(response);
      } catch (err) {
        hideTypingIndicator();
        addAIMessage('\u62b1\u6b49\uff0c\u5904\u7406\u65f6\u51fa\u73b0\u4e86\u9519\u8bef\uff0c\u8bf7\u91cd\u8bd5\u3002');
      }
      isSending = false;
      btnSend.disabled = false;
    };

    window.quickSend = function(text) {
      chatInput.value = text;
      sendMessage();
    };

    window.handleKey = function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
      setTimeout(() => {
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 128) + 'px';
      }, 0);
    };

    window.generateAndConfirm = async function() {
      if (isSending) return;
      isSending = true;
      btnSend.disabled = true;
      addUserMessage('\u8bf7\u786e\u8ba4\u5f53\u524d\u8ba8\u8bba\u7684\u4efb\u52a1\uff0c\u5e76\u751f\u6210\u4efb\u52a1\u56fe\u8c31\u3002');
      showTypingIndicator();
      try {
        var desc = projectName + ' - ' + projectDesc;
        var plan = await MockAI.generateTaskPlan(desc);
        hideTypingIndicator();
        addAIMessage(plan.summary + '\n\n\u5df2\u751f\u6210 **' + plan.tasks.length + ' \u4e2a\u4efb\u52a1\u6b65\u9aa4**\uff0c\u4f9d\u8d56\u5173\u7cfb\u5df2\u81ea\u52a8\u5efa\u7acb\u3002\n\n\u70b9\u51fb\u4e0b\u65b9\u300c\u67e5\u770b\u4efb\u52a1\u56fe\u8c31\u300d\u6309\u94ae\uff0c\u53ef\u5728\u53ef\u89c6\u5316\u56fe\u8c31\u4e2d\u67e5\u770b\u548c\u7f16\u8f91\u4efb\u52a1\u8be6\u60c5\u3002');
        var tasksWithPos = plan.tasks.map(function(t, i) {
          return Object.assign({}, t, {
            x: 100 + (i % 3) * 260,
            y: 60 + Math.floor(i / 3) * 180
          });
        });
        if (tasksWithPos.length > 0) tasksWithPos[0].status = 'completed';
        if (tasksWithPos.length > 1) tasksWithPos[1].status = 'completed';
        if (tasksWithPos.length > 2) tasksWithPos[2].status = 'in-progress';
        if (tasksWithPos.length > 3) tasksWithPos[3].status = 'in-progress';
        Utils.storageSet('demo_tasks', tasksWithPos);
        document.getElementById('bottomActions').classList.remove('hidden');
        document.getElementById('taskCount').textContent = tasksWithPos.length + ' \u4e2a\u4efb\u52a1';
        Utils.showToast('\u4efb\u52a1\u8ba1\u5212\u5df2\u751f\u6210\u5e76\u4fdd\u5b58', 'success');
      } catch (err) {
        hideTypingIndicator();
        addAIMessage('\u751f\u6210\u4efb\u52a1\u8ba1\u5212\u65f6\u51fa\u9519\uff0c\u8bf7\u91cd\u8bd5\u3002');
      }
      isSending = false;
      btnSend.disabled = false;
    };
  })();
  </script>
</body>
</html>
