<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目创建 — AICodeAgent 任务分期看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        primary: { 50:'#ede9fe',100:'#ddd6fe',200:'#c4b5fd',300:'#a29bfe',400:'#8b7efa',500:'#6c5ce7',600:'#5a4bd1',700:'#4a3cb8',800:'#3d319a',900:'#332a7e' },
        dark: { 50:'#32324f',100:'#2a2a45',200:'#22223a',300:'#1a1a2e',400:'#151525',500:'#0f0f1a' },
      }}}}
  </script>
  <script src="js/utils.js"></script>
  <script src="js/mock-ai.js"></script>
  <style>
    body{opacity:0;transition:opacity .4s ease}body.loaded{opacity:1}
    .toast-container{position:fixed;top:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
    .toast{display:flex;align-items:center;gap:8px;padding:12px 20px;background:#1a1a2e;border:1px solid #2e2e48;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.4);font-size:14px;animation:toastIn .25s ease both;min-width:280px;color:#e8e8f0}
    .toast--success{border-left:3px solid #00cec9}.toast--error{border-left:3px solid #ff7675}.toast--info{border-left:3px solid #74b9ff}
    @keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
    .md-content h3{font-size:1rem;font-weight:700;color:#e8e8f0;margin:12px 0 6px}
    .md-content h4{font-size:.9rem;font-weight:600;color:#a0a0b8;margin:10px 0 4px}
    .md-content p{margin:6px 0;line-height:1.7}
    .md-content ul,.md-content ol{padding-left:20px;margin:6px 0}
    .md-content li{margin:3px 0;line-height:1.6}
    .md-content code{background:#22223a;padding:1px 6px;border-radius:4px;font-size:.85em}
    .md-content strong{color:#a29bfe}
  </style>
</head>
<body class="bg-dark-500 text-gray-100 font-sans min-h-screen flex flex-col">

  <!-- Nav -->
  <nav class="bg-gray-800/90 backdrop-blur-md sticky top-0 z-50 h-14 flex items-center px-4 sm:px-6 border-b border-gray-700 shrink-0">
    <a href="index.html" class="flex items-center gap-2 text-gray-300 hover:text-white transition-colors text-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      返回首页
    </a>
    <div class="mx-4 h-5 w-px bg-gray-600"></div>
    <div class="flex items-center gap-2">
      <span class="text-lg">🚀</span>
      <span class="font-bold text-white text-sm sm:text-base">项目创建</span>
      <span class="text-xs bg-primary-500/20 text-primary-300 px-2 py-0.5 rounded-full ml-1">Step 1/3</span>
    </div>
    <div class="ml-auto hidden sm:flex items-center gap-2 text-xs">
      <span class="flex items-center gap-1 text-primary-300 font-semibold">
        <span class="w-5 h-5 rounded-full bg-primary-600 text-white flex items-center justify-center text-[10px] font-bold">1</span>项目创建</span>
      <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      <span class="flex items-center gap-1 text-gray-500">
        <span class="w-5 h-5 rounded-full bg-gray-700 text-gray-500 flex items-center justify-center text-[10px] font-bold">2</span>AI 讨论</span>
      <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      <span class="flex items-center gap-1 text-gray-500">
        <span class="w-5 h-5 rounded-full bg-gray-700 text-gray-500 flex items-center justify-center text-[10px] font-bold">3</span>任务图谱</span>
    </div>
  </nav>


  <!-- Main content -->
  <main class="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
    <div class="mb-8">
      <h1 class="text-2xl sm:text-3xl font-extrabold mb-2 bg-gradient-to-r from-white to-primary-300 bg-clip-text text-transparent">创建新项目</h1>
      <p class="text-gray-400 text-sm leading-relaxed">填写项目基本信息，AI 将自动生成项目 README 文件并初始化 Git 仓库。</p>
    </div>

    <div class="bg-dark-200 border border-gray-700 rounded-2xl p-5 sm:p-8 mb-6">
      <div class="mb-5">
        <label class="block text-sm font-semibold text-gray-300 mb-2">📂 项目名称 <span class="text-red-400">*</span></label>
        <input id="projectName" type="text" placeholder="例如: my-awesome-app" class="w-full bg-dark-50 border border-gray-600 rounded-xl text-white text-sm px-4 py-3 outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-all placeholder-gray-500">
        <p class="text-xs text-gray-500 mt-1.5">用于目录名和仓库标识，仅支持字母、数字、连字符</p>
      </div>
      <div class="mb-5">
        <label class="block text-sm font-semibold text-gray-300 mb-2">📝 项目描述 <span class="text-red-400">*</span></label>
        <textarea id="projectDesc" rows="4" placeholder="简要描述项目的用途、核心功能和目标..." class="w-full bg-dark-50 border border-gray-600 rounded-xl text-white text-sm px-4 py-3 outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-all placeholder-gray-500 resize-none"></textarea>
        <p class="text-xs text-gray-500 mt-1.5">AI 将根据描述自动生成 README.md 文件内容</p>
      </div>
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-300 mb-2">📁 目标路径</label>
        <div class="flex gap-3">
          <input id="projectPath" type="text" placeholder="/home/user/projects/" class="flex-1 bg-dark-50 border border-gray-600 rounded-xl text-white text-sm px-4 py-3 outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-all placeholder-gray-500">
          <button onclick="selectDirectory()" class="px-4 py-3 bg-gray-700 hover:bg-gray-600 text-gray-200 text-sm font-semibold rounded-xl transition-colors flex items-center gap-1.5 shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
            浏览
          </button>
        </div>
        <p class="text-xs text-gray-500 mt-1.5">留空则使用默认路径 ~/projects/（演示模式：此为模拟操作）</p>
      </div>
      <div class="flex flex-col sm:flex-row gap-3">
        <button id="btnCreate" onclick="createProject()" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-6 rounded-xl transition-all flex items-center justify-center gap-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
          创建项目并生成 README
        </button>
        <button onclick="resetForm()" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-gray-300 font-semibold rounded-xl transition-colors text-sm">重置</button>
      </div>
    </div>


    <!-- Result section (hidden by default) -->
    <div id="resultSection" class="hidden">
      <div class="bg-green-900/30 border border-green-700/50 rounded-2xl p-5 mb-5 flex items-start gap-3">
        <span class="text-2xl shrink-0">✅</span>
        <div>
          <h3 class="font-bold text-green-300 mb-1">项目创建成功！</h3>
          <p class="text-sm text-green-200/70">项目已初始化，README.md 已由 AI 自动生成。以下是生成的内容预览：</p>
        </div>
      </div>
      <div class="bg-dark-200 border border-gray-700 rounded-2xl overflow-hidden mb-6">
        <div class="flex items-center justify-between px-5 py-3 border-b border-gray-700 bg-dark-100">
          <div class="flex items-center gap-2 text-sm"><span class="text-gray-400">📄</span><span class="text-gray-300 font-semibold">README.md</span><span class="text-xs text-gray-500 ml-2">AI 生成</span></div>
          <button onclick="copyReadme()" class="text-xs text-gray-400 hover:text-white transition-colors flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>复制</button>
        </div>
        <div id="readmePreview" class="p-5 text-sm text-gray-300 md-content max-h-96 overflow-y-auto leading-relaxed"></div>
      </div>
      <div id="projectSummary" class="bg-dark-200 border border-gray-700 rounded-2xl p-5 mb-6">
        <h3 class="text-sm font-bold text-gray-300 mb-3 flex items-center gap-2">
          <svg class="w-4 h-4 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>项目信息</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
          <div class="flex items-center gap-2 text-gray-400"><span class="text-gray-500">名称:</span><span id="sumName" class="text-white font-mono">—</span></div>
          <div class="flex items-center gap-2 text-gray-400"><span class="text-gray-500">路径:</span><span id="sumPath" class="text-white font-mono text-xs">—</span></div>
          <div class="flex items-center gap-2 text-gray-400 sm:col-span-2"><span class="text-gray-500">描述:</span><span id="sumDesc" class="text-white">—</span></div>
        </div>
      </div>
      <div class="flex flex-col sm:flex-row gap-3">
        <a id="btnNextStep" href="ai-chat.html" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-6 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
          💬 进入 AI 讨论，梳理任务需求
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        </a>
        <a href="index.html" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-gray-300 font-semibold rounded-xl transition-colors text-sm text-center">返回首页</a>
      </div>
    </div>
  </main>


  <script>
  (() => {
    'use strict';
    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => document.body.classList.add('loaded'));
      loadSavedData();
    });
    function loadSavedData() {
      var project = Utils.storageGet('demo_project');
      if (project && project.name) {
        document.getElementById('projectName').value = project.name || '';
        document.getElementById('projectDesc').value = project.description || '';
        document.getElementById('projectPath').value = project.path || '';
        if (project.readme) showResult(project);
      }
    }
    window.selectDirectory = function() {
      var paths = ['/home/user/projects/','/Users/developer/workspace/','/workspace/apps/'];
      document.getElementById('projectPath').value = paths[Math.floor(Math.random() * paths.length)];
      Utils.showToast('已选择目录（演示模式）', 'info');
    };
    window.createProject = async function() {
      var name = document.getElementById('projectName').value.trim();
      var desc = document.getElementById('projectDesc').value.trim();
      var path = document.getElementById('projectPath').value.trim() || '~/projects/';
      if (!name) { Utils.showToast('请输入项目名称','error'); document.getElementById('projectName').focus(); return; }
      if (!desc) { Utils.showToast('请输入项目描述','error'); document.getElementById('projectDesc').focus(); return; }
      if (!/^[a-zA-Z0-9_-]+$/.test(name)) { Utils.showToast('项目名称仅支持字母、数字、连字符和下划线','error'); return; }
      var btn = document.getElementById('btnCreate');
      btn.disabled = true;
      btn.textContent = 'AI 正在生成 README...';
      try {
        await Utils.sleep(600); Utils.showToast('创建项目目录结构...', 'info');
        await Utils.sleep(400); Utils.showToast('初始化 Git 仓库...', 'info');
        await Utils.sleep(300);
        var readme = await MockAI.generateREADME(name, desc);
        var project = { name: name, description: desc, path: path + name, readme: readme, createdAt: new Date().toISOString() };
        Utils.storageSet('demo_project', project);
        showResult(project);
        Utils.showToast('项目创建成功！README 已生成', 'success');
      } catch (err) { Utils.showToast('创建失败，请重试', 'error'); }
      finally { btn.disabled = false; btn.textContent = '创建项目并生成 README'; }
    };
    function showResult(project) {
      document.getElementById('resultSection').classList.remove('hidden');
      document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
      document.getElementById('readmePreview').innerHTML = Utils.markdownToHtml(project.readme);
      document.getElementById('sumName').textContent = project.name;
      document.getElementById('sumPath').textContent = project.path;
      document.getElementById('sumDesc').textContent = project.description;
    }
    window.copyReadme = async function() {
      var project = Utils.storageGet('demo_project');
      if (project && project.readme) await Utils.copyToClipboard(project.readme);
    };
    window.resetForm = function() {
      document.getElementById('projectName').value = '';
      document.getElementById('projectDesc').value = '';
      document.getElementById('projectPath').value = '';
      document.getElementById('resultSection').classList.add('hidden');
      Utils.storageRemove('demo_project');
      Utils.showToast('表单已重置', 'info');
    };
  })();
  </script>
</body>
</html>
